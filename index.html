    <div id="container">
        <header>
            <h1>Data-Over-Sound</h1>
            <p>A prototype inspired by <a href="https://github.com/ggerganov/wave-share" target="_blank">wave-share</a> by ggerganov.</p>
        </header>
        <main>
            <div id="transmitter">
                <textarea id="message-input" placeholder="Type a short message..." maxlength="50"></textarea>

                <canvas id="visualizer"></canvas>
            </div>
            <div id="status">Status: Tap screen to start</div>
        </main>
